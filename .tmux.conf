set-option -g default-command ""

# tmux 上でのESCキーの反応時間の設定
set-option -sg escape-time 0
# ----------------- #
# ウィンドウの振る舞い #
# ----------------- #

## ウィンドウ番号1から開始する
set-option -g base-index 1

# マウスでスクロールできるようにする
set -g mouse on
# Optionを押しながら範囲選択すると、システムクリップボードに直接コピーできる。

# ウィンドウ(タブ)を閉じた時、ウインドウ番号を付番をしなおす
set-option -g renumber-windows on

# ------------------- #
# ステータスバーの見た目 #
# ------------------- #

# 色コード: http://www.calmar.ws/vim/256-xterm-24bit-rgb-color-chart.html

# 256色サポート
set-option -g default-terminal "xterm"
set -g terminal-overrides 'xterm:colors=256'
# set-option -g default-terminal "screen-256color"
set-option -g default-terminal "screen-256color"

# ステータスバーの色
set -g status-style fg=colour253,bg=colour237

# 非アクティブなウィンドウの色
set-window-option -g window-status-style fg=default,bg=default

# アクティブなウィンドウの色
set-window-option -g window-status-current-style fg=colour16,bg=colour178

# ステータスバーの位置
set-option -g status-position top

# ステータスバー左隅に出すもの
set -g status-left '#[fg=colour32, bold]#{b:pane_current_path}'

# ステータスバー右隅に出すもの
set -g status-right ''

# focus-eventの有効化
set -g focus-events on

# vimのキーバインドでペインを移動する
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vimのキーバインドでペインをリサイズする
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# | でペインを横分割する
bind | split-window -h

# - でペインを縦分割する
bind - split-window -v

# C-k でペインをクリーンする
 # bind C-k send-keys -R \; clear; clear
# bind -n C-k send-keys -R \; clear-history
# bind -n C-k clear-history
bind C-k clear-history \; display-message "history cleared"

# Ghosttyのタブ名をカレントディレクトリ名に設定する
set -g set-titles on
set -g set-titles-string "#{b:pane_current_path}"

set -g update-environment 'ITERM_PROFILE'
set-option -g default-command ""

# set-option -g default-command "exec reattach-to-user-namespace -l $SHELL"
setw -g mode-keys vi
bind-key    -T copy-mode-vi v     send-keys -X begin-selection
bind-key    -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
bind-key    -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

# Option(Alt) + h/l でウィンドウ移動 (prefix+h/l とは競合しない)
bind -n M-h previous-window
bind -n M-l next-window

# Option + 数字で直接ウィンドウ選択
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4

# Shift+Enter などの拡張キーシーケンスを通過させる
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'
